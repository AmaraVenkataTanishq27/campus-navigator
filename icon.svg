<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#022B4A" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="4" />

  <!-- Outer Glowing Radar / Compass Ring -->
  <circle cx="256" cy="235" r="150" fill="none" stroke="#00F0FF" stroke-width="8" opacity="0.3" stroke-dasharray="16 12" />
  <circle cx="256" cy="235" r="120" fill="none" stroke="#00F0FF" stroke-width="5" opacity="0.7" filter="url(#neonGlow)" />

  <!-- Central Speed Compass Dart (HURRY!) -->
  <path d="M256 120 L320 280 L256 250 L192 280 Z" fill="url(#cyanGradient)" filter="url(#neonGlow)" />
  <path d="M256 120 L192 280 L256 250 Z" fill="#00C4D6" />

  <!-- Hot Pink Center Navigation Marker -->
  <circle cx="256" cy="235" r="14" fill="#FF007F" stroke="#FFFFFF" stroke-width="4" filter="url(#neonGlow)" />

  <!-- App Typography: HURRY! MSRIT -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="3">
    HURRY!
  </text>
  <text x="256" y="465" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="24" fill="#00F0FF" letter-spacing="6">
    MSRIT
  </text>
</svg>
