<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Navigator - Visual Graph Data Mapping Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 380px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }
    .header {
      padding: 16px 20px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .controls {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom: 1px solid #334155;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn {
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn-primary { background: #0284c7; border-color: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-secondary { background: #334155; border-color: #475569; color: white; }
    .btn-secondary:hover { background: #475569; }
    .btn-active { background: #10b981 !important; border-color: #10b981 !important; }

    .tabs {
      display: flex;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #94a3b8;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .tab-btn.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .json-box {
      width: 100%;
      height: 260px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #a5f3fc;
      font-family: monospace;
      font-size: 11px;
      padding: 10px;
      resize: none;
      white-space: pre;
    }
    .stats-card {
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      margin-bottom: 12px;
      font-size: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-val { font-size: 18px; font-weight: 700; color: #38bdf8; }

    #viewport {
      flex: 1;
      position: relative;
      background: #090d16;
      overflow: hidden;
      cursor: crosshair;
    }
    #canvas-container {
      position: absolute;
      transform-origin: 0 0;
      user-select: none;
    }
    #floor-img {
      display: block;
      pointer-events: none;
    }
    #svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: all;
    }
    .hud {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #cbd5e1;
      z-index: 5;
    }
    .coord-badge {
      font-family: monospace;
      color: #38bdf8;
      font-weight: 600;
    }
    .legend {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid #334155;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 5;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-room { background: #3b82f6; }
    .dot-junction { background: #f59e0b; }
    .dot-stairs { background: #ef4444; }
    .dot-elevator { background: #10b981; }

    .node-circle {
      cursor: pointer;
      transition: r 0.15s ease;
    }
    .node-circle:hover {
      r: 10;
      stroke-width: 3;
    }
    .edge-line {
      stroke: #38bdf8;
      stroke-width: 3;
      stroke-opacity: 0.7;
      stroke-linecap: round;
      cursor: pointer;
    }
    .edge-line:hover {
      stroke: #f43f5e;
      stroke-width: 5;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="header">
      <h1>📍 Campus Graph Mapper</h1>
      <p>Click-to-coordinate floor plan graph builder</p>
    </div>

    <div class="controls">
      <div class="form-group">
        <label>Active Floor Plan</label>
        <select id="floor-select">
          <option value="0">Apex Block - Ground Floor</option>
          <option value="1">Apex Block - Floor 1</option>
          <option value="2">Apex Block - Floor 2</option>
          <option value="3">Apex Block - Floor 3</option>
          <option value="4" selected>Apex Block - Floor 4</option>
          <option value="5">Apex Block - Floor 5</option>
          <option value="6">Apex Block - Floor 6</option>
        </select>
      </div>

      <div class="form-group">
        <label>Action Mode</label>
        <div class="btn-group">
          <button id="mode-node-btn" class="btn btn-secondary btn-active">1. Add Node</button>
          <button id="mode-edge-btn" class="btn btn-secondary">2. Link Edge</button>
        </div>
      </div>

      <div id="node-config-box" style="display: flex; flex-direction: column; gap: 8px; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155;">
        <div class="form-group">
          <label>Next Node Type</label>
          <select id="node-type">
            <option value="room">Room / Destination</option>
            <option value="junction">Hallway Junction / Turn</option>
            <option value="stairs">Staircase</option>
            <option value="elevator">Elevator</option>
          </select>
        </div>
        <div class="form-group">
          <label>Label Prefix</label>
          <input id="node-label-input" type="text" placeholder="e.g. Room 605, West Corner" value="Room " />
        </div>
      </div>

      <div class="btn-group">
        <button id="btn-reset-view" class="btn btn-secondary">Reset Zoom</button>
        <button id="btn-clear-floor" class="btn btn-secondary" style="color: #f87171;">Clear Floor</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-json">JSON Output</button>
      <button class="tab-btn" data-tab="tab-nodes">Node List</button>
    </div>

    <div id="tab-json" class="tab-content">
      <div class="stats-card">
        <div>
          <div>Total Nodes</div>
          <div id="stat-nodes" class="stat-val">0</div>
        </div>
        <div>
          <div>Total Edges</div>
          <div id="stat-edges" class="stat-val">0</div>
        </div>
      </div>
      <textarea id="json-output" class="json-box" readonly></textarea>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
        <button id="btn-copy-json" class="btn btn-primary">📋 Copy campus_graph.json</button>
        <button id="btn-download-json" class="btn btn-secondary">💾 Download JSON File</button>
        <button id="btn-load-current" class="btn btn-secondary">⚡ Load Bundled Graph</button>
      </div>
    </div>

    <div id="tab-nodes" class="tab-content" style="display: none;">
      <div id="node-list-container" style="display: flex; flex-direction: column; gap: 6px; font-size: 12px;"></div>
    </div>
  </div>

  <div id="viewport">
    <div id="canvas-container">
      <img id="floor-img" src="/assets/floor-plans/reference/apex-4th-floor.jpeg" alt="Floor Plan" />
      <svg id="svg-layer"></svg>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="dot dot-room"></div> Room / Office</div>
      <div class="legend-item"><div class="dot dot-junction"></div> Hallway Turn</div>
      <div class="legend-item"><div class="dot dot-elevator"></div> Elevator</div>
      <div class="legend-item"><div class="dot dot-stairs"></div> Stairwell</div>
    </div>

    <div class="hud">
      <div>Floor: <span id="hud-floor" class="coord-badge">4</span></div>
      <div>Pixel Coords: <span id="hud-coords" class="coord-badge">0, 0</span></div>
      <div>Scale: <span id="hud-zoom" class="coord-badge">100%</span></div>
      <div id="edge-tip" style="color: #f59e0b; display: none;">Click 1st node to start link...</div>
    </div>
  </div>

  <script>
    const floorImages = {
      "0": "/assets/floor-plans/reference/apex-0th-floor.png",
      "1": "/assets/floor-plans/reference/apex-1st-floor.png",
      "2": "/assets/floor-plans/reference/apex-2nd-floor.jpeg",
      "3": "/assets/floor-plans/reference/apex-3rd-floor.jpeg",
      "4": "/assets/floor-plans/reference/apex-4th-floor.jpeg",
      "5": "/assets/floor-plans/reference/apex-5th-floor.jpeg",
      "6": "/assets/floor-plans/reference/apex-6th-floor.png"
    };

    let graphData = {
      floors: {
        "0": { name: "Apex Block - Ground Floor", planImage: floorImages["0"], width: 1587, height: 2244 },
        "1": { name: "Apex Block - Floor 1", planImage: floorImages["1"], width: 1587, height: 2244 },
        "2": { name: "Apex Block - Floor 2", planImage: floorImages["2"], width: 1600, height: 1515 },
        "3": { name: "Apex Block - Floor 3", planImage: floorImages["3"], width: 1600, height: 1515 },
        "4": { name: "Apex Block - Floor 4", planImage: floorImages["4"], width: 1600, height: 1515 },
        "5": { name: "Apex Block - Floor 5", planImage: floorImages["5"], width: 1600, height: 1515 },
        "6": { name: "Apex Block - Floor 6", planImage: floorImages["6"], width: 1587, height: 2244 }
      },
      nodes: {},
      edges: []
    };

    let currentFloor = "4";
    let currentMode = "add_node";
    let selectedFirstNode = null;

    let scale = 0.5;
    let panX = 40;
    let panY = 20;
    let isPanning = false;
    let startX = 0, startY = 0;

    const viewport = document.getElementById('viewport');
    const container = document.getElementById('canvas-container');
    const floorImg = document.getElementById('floor-img');
    const svgLayer = document.getElementById('svg-layer');
    const hudCoords = document.getElementById('hud-coords');
    const hudZoom = document.getElementById('hud-zoom');
    const hudFloor = document.getElementById('hud-floor');
    const edgeTip = document.getElementById('edge-tip');
    const jsonOutput = document.getElementById('json-output');

    function updateTransform() {
      container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      hudZoom.textContent = `${Math.round(scale * 100)}%`;
    }
    updateTransform();

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const newScale = Math.min(Math.max(scale * zoomFactor, 0.2), 3.0);

      panX = mouseX - (mouseX - panX) * (newScale / scale);
      panY = mouseY - (mouseY - panY) * (newScale / scale);
      scale = newScale;
      updateTransform();
    });

    viewport.addEventListener('mousedown', (e) => {
      if (e.button === 1 || e.altKey || e.shiftKey) {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        viewport.style.cursor = 'grabbing';
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      }

      const rect = container.getBoundingClientRect();
      const px = Math.round((e.clientX - rect.left) / scale);
      const py = Math.round((e.clientY - rect.top) / scale);
      if (px >= 0 && px <= 1600 && py >= 0 && py <= 1515) {
        hudCoords.textContent = `${px}, ${py}`;
      }
    });

    window.addEventListener('mouseup', () => {
      if (isPanning) {
        isPanning = false;
        viewport.style.cursor = 'crosshair';
      }
    });

    document.getElementById('floor-select').addEventListener('change', (e) => {
      currentFloor = e.target.value;
      hudFloor.textContent = currentFloor;
      floorImg.src = floorImages[currentFloor] || floorImages["6"];
      renderSVG();
    });

    const nodeBtn = document.getElementById('mode-node-btn');
    const edgeBtn = document.getElementById('mode-edge-btn');
    nodeBtn.addEventListener('click', () => {
      currentMode = 'add_node';
      nodeBtn.classList.add('btn-active');
      edgeBtn.classList.remove('btn-active');
      edgeTip.style.display = 'none';
      selectedFirstNode = null;
      renderSVG();
    });
    edgeBtn.addEventListener('click', () => {
      currentMode = 'link_edge';
      edgeBtn.classList.add('btn-active');
      nodeBtn.classList.remove('btn-active');
      edgeTip.style.display = 'inline-block';
      edgeTip.textContent = 'Click 1st node to start link...';
      selectedFirstNode = null;
      renderSVG();
    });

    svgLayer.addEventListener('click', (e) => {
      if (isPanning || e.altKey || e.shiftKey) return;
      if (e.target.classList.contains('node-circle') || e.target.classList.contains('edge-line')) return;

      if (currentMode === 'add_node') {
        const rect = container.getBoundingClientRect();
        const x = Math.round((e.clientX - rect.left) / scale);
        const y = Math.round((e.clientY - rect.top) / scale);

        const type = document.getElementById('node-type').value;
        const prefix = document.getElementById('node-label-input').value.trim() || 'Node';
        const floorNum = isNaN(Number(currentFloor)) ? 1 : Number(currentFloor);
        const id = `${type.toUpperCase()}_F${currentFloor}_${Date.now().toString().slice(-4)}`;
        const label = `${prefix} (${x}, ${y})`;

        graphData.nodes[id] = {
          label: label,
          floor: floorNum,
          type: type,
          x: x,
          y: y
        };

        renderSVG();
        updateJSON();
      }
    });

    function getDirection(n1, n2) {
      if (n1.floor !== n2.floor) return n2.floor > n1.floor ? 'up' : 'down';
      const dx = n2.x - n1.x;
      const dy = n2.y - n1.y;
      if (Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? 'E' : 'W';
      return dy >= 0 ? 'S' : 'N';
    }

    function calcDist(n1, n2) {
      const dx = n1.x - n2.x;
      const dy = n1.y - n2.y;
      return Math.round(Math.hypot(dx, dy) * 0.065 * 10) / 10 || 1.0;
    }

    function renderSVG() {
      svgLayer.innerHTML = '';
      const currentFloorNum = isNaN(Number(currentFloor)) ? 1 : Number(currentFloor);

      graphData.edges.forEach((edge, idx) => {
        const n1 = graphData.nodes[edge.from];
        const n2 = graphData.nodes[edge.to];
        if (!n1 || !n2) return;
        if (n1.floor !== currentFloorNum && n2.floor !== currentFloorNum) return;

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', n1.x);
        line.setAttribute('y1', n1.y);
        line.setAttribute('x2', n2.x);
        line.setAttribute('y2', n2.y);
        line.setAttribute('class', 'edge-line');
        line.setAttribute('title', `${n1.label} ↔ ${n2.label} (${edge.weight}m)`);
        line.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm(`Delete edge between ${n1.label} and ${n2.label}?`)) {
            graphData.edges.splice(idx, 1);
            renderSVG();
            updateJSON();
          }
        });
        svgLayer.appendChild(line);
      });

      Object.entries(graphData.nodes).forEach(([id, node]) => {
        if (node.floor !== currentFloorNum) return;

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', node.x);
        circle.setAttribute('cy', node.y);
        circle.setAttribute('r', id === selectedFirstNode ? '10' : '7');
        circle.setAttribute('class', 'node-circle');

        let fill = '#3b82f6';
        if (node.type === 'junction') fill = '#f59e0b';
        if (node.type === 'stairs') fill = '#ef4444';
        if (node.type === 'elevator') fill = '#10b981';

        circle.setAttribute('fill', fill);
        circle.setAttribute('stroke', id === selectedFirstNode ? '#ffffff' : '#0f172a');
        circle.setAttribute('stroke-width', id === selectedFirstNode ? '3' : '1.5');

        circle.addEventListener('click', (e) => {
          e.stopPropagation();
          if (currentMode === 'link_edge') {
            if (!selectedFirstNode) {
              selectedFirstNode = id;
              edgeTip.textContent = `Selected: ${node.label}. Click 2nd node to connect.`;
              renderSVG();
            } else if (selectedFirstNode === id) {
              selectedFirstNode = null;
              edgeTip.textContent = 'Click 1st node to start link...';
              renderSVG();
            } else {
              const n1 = graphData.nodes[selectedFirstNode];
              const n2 = node;
              const dist = calcDist(n1, n2);
              const dir1 = getDirection(n1, n2);
              const dir2 = getDirection(n2, n1);

              graphData.edges.push({ from: selectedFirstNode, to: id, weight: dist, direction: dir1 });
              graphData.edges.push({ from: id, to: selectedFirstNode, weight: dist, direction: dir2 });

              selectedFirstNode = null;
              edgeTip.textContent = 'Edge connected! Click 1st node for next link...';
              renderSVG();
              updateJSON();
            }
          } else {
            const action = prompt(`Node: ${node.label} (${id})\nType: ${node.type}\nCoords: ${node.x}, ${node.y}\n\nType 'delete' to remove or enter new label:`, node.label);
            if (action === 'delete') {
              delete graphData.nodes[id];
              graphData.edges = graphData.edges.filter(e => e.from !== id && e.to !== id);
              renderSVG();
              updateJSON();
            } else if (action && action.trim()) {
              node.label = action.trim();
              renderSVG();
              updateJSON();
            }
          }
        });

        svgLayer.appendChild(circle);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', node.x);
        text.setAttribute('y', node.y - 12);
        text.setAttribute('fill', '#f8fafc');
        text.setAttribute('font-size', '10px');
        text.setAttribute('font-weight', '600');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('pointer-events', 'none');
        text.setAttribute('paint-order', 'stroke');
        text.setAttribute('stroke', '#090d16');
        text.setAttribute('stroke-width', '2px');
        text.textContent = node.label;
        svgLayer.appendChild(text);
      });
    }

    function updateJSON() {
      const nodeCount = Object.keys(graphData.nodes).length;
      const edgeCount = graphData.edges.length;
      document.getElementById('stat-nodes').textContent = nodeCount;
      document.getElementById('stat-edges').textContent = edgeCount;
      jsonOutput.value = JSON.stringify(graphData, null, 2);
      renderNodeList();
    }

    function renderNodeList() {
      const list = document.getElementById('node-list-container');
      list.innerHTML = '';
      Object.entries(graphData.nodes).forEach(([id, n]) => {
        const item = document.createElement('div');
        item.style.padding = '6px 8px';
        item.style.background = '#0f172a';
        item.style.borderRadius = '4px';
        item.style.border = '1px solid #334155';
        item.innerHTML = `<strong>${n.label}</strong> [F${n.floor} ${n.type}] (${n.x}, ${n.y})`;
        list.appendChild(item);
      });
    }

    document.getElementById('btn-reset-view').addEventListener('click', () => {
      scale = 0.5;
      panX = 40;
      panY = 20;
      updateTransform();
    });

    document.getElementById('btn-clear-floor').addEventListener('click', () => {
      if (confirm(`Clear all nodes and edges on Floor ${currentFloor}?`)) {
        const floorNum = Number(currentFloor);
        const toDelete = new Set(Object.keys(graphData.nodes).filter(id => graphData.nodes[id].floor === floorNum));
        toDelete.forEach(id => delete graphData.nodes[id]);
        graphData.edges = graphData.edges.filter(e => !toDelete.has(e.from) && !toDelete.has(e.to));
        renderSVG();
        updateJSON();
      }
    });

    document.getElementById('btn-copy-json').addEventListener('click', () => {
      navigator.clipboard.writeText(jsonOutput.value).then(() => {
        alert('campus_graph.json copied to clipboard!');
      });
    });

    document.getElementById('btn-download-json').addEventListener('click', () => {
      const blob = new Blob([jsonOutput.value], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'campus_graph.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('btn-load-current').addEventListener('click', () => {
      fetch('/campus_graph.json')
        .then(r => r.json())
        .then(data => {
          graphData = data;
          renderSVG();
          updateJSON();
          alert('Loaded existing campus_graph.json successfully!');
        })
        .catch(err => {
          alert('Could not fetch /campus_graph.json: ' + err.message);
        });
    });

    fetch('/campus_graph.json')
      .then(r => r.json())
      .then(data => {
        graphData = data;
        renderSVG();
        updateJSON();
      })
      .catch(() => {
        updateJSON();
      });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).style.display = 'block';
      });
    });
  </script>
</body>
</html>
